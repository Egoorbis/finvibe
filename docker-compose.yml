services:
  postgres:
    image: postgres:15-alpine
    container_name: finvibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finvibe}
      POSTGRES_USER: ${DB_USER:-finvibe_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finvibe_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finvibe_user} -d ${DB_NAME:-finvibe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finvibe-network

  legacy-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.legacy
    container_name: finvibe-legacy-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-finvibe}
      DB_USER: ${DB_USER:-finvibe_user}
      DB_PASSWORD: ${DB_PASSWORD:-finvibe_password}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - finvibe-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finvibe-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      LEGACY_BACKEND_URL: http://legacy-backend:3000
    depends_on:
      legacy-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - finvibe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finvibe-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - finvibe-network

volumes:
  postgres_data:
    driver: local

networks:
  finvibe-network:
    driver: bridge
