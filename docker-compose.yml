services:
  postgres:
    image: postgres:15-alpine
    container_name: finvibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finvibe}
      POSTGRES_USER: ${DB_USER:-finvibe_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finvibe_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finvibe_user} -d ${DB_NAME:-finvibe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [finvibe-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finvibe-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-finvibe_user}:${DB_PASSWORD:-finvibe_password}@postgres:5432/${DB_NAME:-finvibe}
      SECRET_KEY: ${JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@finvibe.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [finvibe-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finvibe-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [finvibe-network]

volumes:
  postgres_data:
    driver: local
networks:
  finvibe-network:
    driver: bridge
