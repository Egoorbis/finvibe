[project]
name = "finvibe-backend"
version = "0.1.0"
description = "Backend API for FinVibe - Personal Finance Tracker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "psycopg2-binary>=2.9,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "passlib[bcrypt]>=1.7,<2",
  "bcrypt>=4.2,<5",
  "resend>=2,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "boto3>=1.36,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1"]
lint = ["ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
