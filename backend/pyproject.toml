[project]
name = "finvibe-backend"
version = "0.1.0"
description = "FastAPI backend for FinVibe - Personal Finance Tracker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1","asyncpg>=0.31.0","bandit>=1.9.4","boto3>=1.43.83",
    "deepdiff>=9.1.0","fastapi>=0.141.1","google-genai>=2.20.0","passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12","pydantic[email]>=2.13.5","pydantic-settings>=2.15.0",
    "pytest>=9.1.1","pytest-cov>=7.1.0","PyJWT>=2.9.0","resend>=2.42.0","ruff>=0.16.5",
    "sqlalchemy>=2.0.52","uvicorn>=0.52.4","python-multipart>=0.0.32","httpx>=0.28.1",
    "bcrypt<4.0.0","watchfiles>=1.2.0"
]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
[tool.ruff.lint]
ignore=["BLE001","DTZ007","DTZ901"]
