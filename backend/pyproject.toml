[project]
name = "finvibe-backend"
version = "0.1.0"
description = "FastAPI compatibility layer for FinVibe"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.ruff.lint]
ignore = ["BLE001"]
